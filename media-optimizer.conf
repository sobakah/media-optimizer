# ==============================================================================
# media-optimizer.conf
# Wird automatisch geladen, wenn die Datei neben media-optimizer.sh liegt
# oder unter $XDG_CONFIG_HOME/media-optimizer.conf. Alternativ per
# MO_CONFIG=/pfad/zur/datei erzwingen.
#
# Reihenfolge: CLI-Flag  >  diese Datei  >  eingebauter Default
#
# Zugeschnitten auf Ryzen 7 9700X (8C/16T, Zen 5) + RX 9070 XT (RDNA4, VCN 5).
# ==============================================================================

# ------------------------------------------------------------------------------
# CPU-Encoding (libx265)
# ------------------------------------------------------------------------------
# pools und frame-threads bewusst weggelassen: x265 waehlt auf 16 Threads
# von sich aus einen Pool ueber alle 16 Threads und 4 Frame-Threads. Explizit
# gesetzt aendert das nichts, engt aber ein, sobald die Hardware wechselt.
#
# asm=avx512 ist bei x265 per Default AUS, weil es auf Intel-Chips mit
# halbiertem AVX-512-Datenpfad und Taktabsenkung bremst. Zen 5 hat einen
# vollen 512-Bit-Datenpfad, dort kann es helfen. x265 deckt allerdings nur
# einen Teil seiner Kernels mit AVX-512 ab, der Effekt ist also klein.
# Vor dem Festnageln einmal mit und ohne messen:
#
#   time ffmpeg -i probe.mp4 -c:v libx265 -crf 22 -preset medium \
#        -x265-params asm=avx512:aq-mode=3:no-sao=1 -an -f null -
#   time ffmpeg -i probe.mp4 -c:v libx265 -crf 22 -preset medium \
#        -x265-params aq-mode=3:no-sao=1 -an -f null -
#
CPU_X265_PARAMS="asm=avx512:aq-mode=3:no-sao=1"

CPU_CRF=22
CPU_PRESET="medium"

# ------------------------------------------------------------------------------
# GPU-Encoding (VAAPI, RDNA4)
# ------------------------------------------------------------------------------
VAAPI_DEVICE="auto"   # oder fest, z.B. /dev/dri/renderD129 fuer die dGPU
GPU_QP=26

# auto waehlt anhand der Quell-Bitrate: darunter CPU (bessere Dichte),
# darueber GPU (Durchsatz).
ENCODER_MODE="auto"
BITRATE_THRESHOLD_KBPS=3500

# ------------------------------------------------------------------------------
# Parallelitaet
# ------------------------------------------------------------------------------
# 16 Worker-Prozesse. Jeder cjxl-Prozess bekommt 1 Thread, sonst starten
# 16 Prozesse je 16 Threads.
MAX_WORKERS=16
CJXL_THREADS=1

# ------------------------------------------------------------------------------
# Bilder
# ------------------------------------------------------------------------------
# PNG_MODE steuert nur PNG. JPEG wird immer verlustfrei nach JXL transcodiert,
# daran aendert diese Einstellung nichts.
#
# -q wird intern auf eine Butteraugli-Distanz abgebildet:
#     -q 75 -> d2.35   (alter Wert, bei Text und Kanten sichtbar)
#     -q 85 -> d1.45
#     -q 90 -> d1.00   visuell verlustfrei, libjxl-Zielwert
#     -q 93 -> d0.73   Reserve fuer Screenshots und Strichgrafik
#     -q 95 -> d0.55
#
# Groessen an einem 1080p-Testbild, jeweils in Prozent des PNG:
#                       fotoaehnlich   Screenshot/Text
#     -q 75                      7 %              19 %
#     -q 90                     12 %              33 %
#     -q 93                     14 %              39 %
#     verlustfrei (-d 0)        52 %              55 %
#
# 90 ist der Kompromiss: gegenueber dem alten 75 rund 5 bzw. 14 Prozentpunkte
# mehr Platzbedarf, dafuer von d2.35 auf d1.00 und damit aus dem Bereich
# heraus, in dem Artefakte an Kanten auffallen. Bei viel Strichgrafik oder
# Screenshots mit kleiner Schrift ist 93 die vorsichtigere Wahl.
PNG_MODE="lossy"
PNG_QUALITY=90
JXL_EFFORT=7

# ------------------------------------------------------------------------------
# Verhalten
# ------------------------------------------------------------------------------
DELETE_ORIGINAL=false
DISCARD_IF_LARGER=true
KEEP_SALVAGED_CORRUPT=true
ENABLE_PROBE=true
# Vor dem Encoding wird ein Testslice aus der Dateimitte kodiert und mit dem
# gleichen Ausschnitt des Originals verglichen (beides video-only, gleiche
# Laenge, ueber die Dateigroesse gemessen).
#   90  = ueberspringen, sobald weniger als 10 % Ersparnis zu erwarten sind
#   100 = nur ueberspringen, wenn die Ausgabe tatsaechlich groesser wuerde
# Kurze Slices ueberschaetzen die neue Bitrate leicht, weil der erste
# Keyframe anteilig stark ins Gewicht faellt. Bei Grenzfaellen hilft ein
# laengerer Slice mehr als eine hoehere Schwelle.
PROBE_MARGIN_PCT=95
PROBE_DURATION=10
FASTSTART=true
MIN_SIZE_MB=5
