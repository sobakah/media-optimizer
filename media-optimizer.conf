# ==============================================================================
# media-optimizer.conf
# Wird automatisch geladen, wenn die Datei neben media-optimizer.sh liegt
# oder unter $XDG_CONFIG_HOME/media-optimizer.conf. Alternativ per
# MO_CONFIG=/pfad/zur/datei erzwingen.
#
# Reihenfolge: CLI-Flag  >  diese Datei  >  eingebauter Default
#
# Zugeschnitten auf Ryzen 7 9700X (8C/16T, Zen 5) + RX 9070 XT (RDNA4, VCN 5).
# ==============================================================================

# ------------------------------------------------------------------------------
# CPU-Encoding (libx265)
# ------------------------------------------------------------------------------
# pools und frame-threads bewusst weggelassen: x265 waehlt auf 16 Threads
# von sich aus einen Pool ueber alle 16 Threads und 4 Frame-Threads. Explizit
# gesetzt aendert das nichts, engt aber ein, sobald die Hardware wechselt.
#
# asm=avx512 ist bei x265 per Default AUS, weil es auf Intel-Chips mit
# halbiertem AVX-512-Datenpfad und Taktabsenkung bremst. Zen 5 hat einen
# vollen 512-Bit-Datenpfad, dort kann es helfen. x265 deckt allerdings nur
# einen Teil seiner Kernels mit AVX-512 ab, der Effekt ist also klein.
# Vor dem Festnageln einmal mit und ohne messen:
#
#   time ffmpeg -i probe.mp4 -c:v libx265 -crf 22 -preset medium \
#        -x265-params asm=avx512:aq-mode=3:no-sao=1 -an -f null -
#   time ffmpeg -i probe.mp4 -c:v libx265 -crf 22 -preset medium \
#        -x265-params aq-mode=3:no-sao=1 -an -f null -
#
CPU_X265_PARAMS="asm=avx512:aq-mode=3:no-sao=1"

CPU_CRF=22
CPU_PRESET="medium"

# ------------------------------------------------------------------------------
# GPU-Encoding (VAAPI, RDNA4)
# ------------------------------------------------------------------------------
# 10-Bit-Quellen auf der GPU: nur mit p010 UND -profile:v main10 zusammen
# gueltig. Ohne beides entsteht ein gruenes Bild. Default false, also werden
# 10-Bit-Quellen auf 8 Bit reduziert - das ist der bewaehrte Pfad.
GPU_ALLOW_10BIT=false

# GPU-Encoder. hevc_vaapi ist der klassische Weg, arbeitet aber auf RDNA 4
# (VCN 5) unter Mesa fehlerhaft: Stride-Mismatch beim Upload, nur der obere
# Speicherabschnitt wird beschrieben, der Rest bleibt genullt und erscheint
# gruen. ffmpeg meldet dabei keinen Fehler.
#   av1_vaapi    eigener, neuerer Codepfad im Treiber, spart zusaetzlich Platz
#   hevc_vulkan  umgeht VA-API vollstaendig ueber RADV (ffmpeg 7.1+)
# Welcher auf deiner Hardware taugt:
#   ./scripts/h264-to-h265.sh --gpu-selftest /pfad/zu/video.mp4
# Container-Tag fuer HEVC in MP4. Leer = ffmpeg-Vorgabe (hev1).
#
# "hvc1" verbessert die Abspielbarkeit in Apple-Playern, verlangt aber, dass
# VPS/SPS/PPS ausschliesslich im hvcC-Kasten stehen. Liefert der
# Hardware-Encoder sie im Datenstrom, entsteht ein unvollstaendiges hvcC:
# die Datei ist korrekt kodiert, aber nicht mehr korrekt dekodierbar.
# Vor dem Setzen unbedingt mit --gpu-selftest pruefen.
HEVC_TAG=""

GPU_CODEC="hevc_vaapi"

# Ratenkontrolle des GPU-Encoders. CQP ist der klassische Weg. Auf manchen
# VCN-Generationen ist er in Mesa unzuverlaessig, dann liefert VBR mit
# Zielqualitaet brauchbare Ergebnisse.
GPU_RC_MODE="CQP"

# B-Frames auf der GPU. Leer = ffmpeg entscheidet. Manche VAAPI-Treiber
# liefern mit erzwungenem Wert fehlerhafte Bilder; --gpu-selftest zeigt es.
GPU_BF=""

# VAAPI Low-Power-Encoder. Auf einigen Generationen stabiler, kann aber
# Funktionen einschraenken.
GPU_LOW_POWER=false

# Welche Kombination auf DEINER Hardware funktioniert, ermittelt:
#   ./scripts/h264-to-h265.sh --gpu-selftest /pfad/zu/einem/video.mp4

# Stichprobenvergleich des Bildinhalts nach dem Encoding (PSNR an mehreren
# Stellen). Faengt zerstoerte Farbformate, die die Laufzeitpruefung passieren.
# Kosten: rund 1s pro Datei.
#
# Bewertet wird die BESTE Stichprobe. Einzelne schlechte Werte entstehen durch
# Zeitversatz beim Suchen, besonders bei variabler Bildrate: dort wurden bei
# einem einwandfreien Video 13, 15 und 24 dB gemessen. Ein wirklich zerstoertes
# Bild liegt an jeder Stelle bei 3 bis 7 dB, daher die Schwelle bei 15.
#
# VISUAL_STRICT=false bedeutet: nur warnen und die Datei behalten. Die Messung
# kann sich irren, deshalb entscheidet nicht das Skript, sondern du.
VERIFY_VISUAL=true
VISUAL_PSNR_MIN=15
VISUAL_SAMPLES=3
VISUAL_STRICT=false

VAAPI_DEVICE="auto"   # oder fest, z.B. /dev/dri/renderD129 fuer die dGPU
GPU_QP=26

# auto waehlt anhand der Quell-Bitrate: darunter CPU (bessere Dichte),
# darueber GPU (Durchsatz).
ENCODER_MODE="auto"
BITRATE_THRESHOLD_KBPS=3500

# ------------------------------------------------------------------------------
# Parallelitaet
# ------------------------------------------------------------------------------
# 16 Worker-Prozesse. Jeder cjxl-Prozess bekommt 1 Thread, sonst starten
# 16 Prozesse je 16 Threads.
MAX_WORKERS=16
CJXL_THREADS=1

# ------------------------------------------------------------------------------
# Bilder
# ------------------------------------------------------------------------------
# PNG_MODE steuert nur PNG. JPEG wird immer verlustfrei nach JXL transcodiert,
# daran aendert diese Einstellung nichts.
#
# -q wird intern auf eine Butteraugli-Distanz abgebildet:
#     -q 75 -> d2.35   (alter Wert, bei Text und Kanten sichtbar)
#     -q 85 -> d1.45
#     -q 90 -> d1.00   visuell verlustfrei, libjxl-Zielwert
#     -q 93 -> d0.73   Reserve fuer Screenshots und Strichgrafik
#     -q 95 -> d0.55
#
# Groessen an einem 1080p-Testbild, jeweils in Prozent des PNG:
#                       fotoaehnlich   Screenshot/Text
#     -q 75                      7 %              19 %
#     -q 90                     12 %              33 %
#     -q 93                     14 %              39 %
#     verlustfrei (-d 0)        52 %              55 %
#
# 90 ist der Kompromiss: gegenueber dem alten 75 rund 5 bzw. 14 Prozentpunkte
# mehr Platzbedarf, dafuer von d2.35 auf d1.00 und damit aus dem Bereich
# heraus, in dem Artefakte an Kanten auffallen. Bei viel Strichgrafik oder
# Screenshots mit kleiner Schrift ist 93 die vorsichtigere Wahl.
PNG_MODE="lossy"
PNG_QUALITY=90
JXL_EFFORT=7

# ------------------------------------------------------------------------------
# Verhalten
# ------------------------------------------------------------------------------
# DELETE_ORIGINAL und RENAME_INPLACE bleiben bewusst auskommentiert: ohne
# Angabe richtet sich die Vorbelegung nach dem Modus (In-Place true, mit
# Zielverzeichnis false). Wer hier einen Wert setzt, legt ihn fuer beide Modi
# fest und unterdrueckt die Rueckfrage.
# DELETE_ORIGINAL=false
DISCARD_IF_LARGER=true
KEEP_SALVAGED_CORRUPT=true
ENABLE_PROBE=true
# Vor dem Encoding wird ein Testslice aus der Dateimitte kodiert und mit dem
# gleichen Ausschnitt des Originals verglichen (beides video-only, gleiche
# Laenge, ueber die Dateigroesse gemessen).
#   90  = ueberspringen, sobald weniger als 10 % Ersparnis zu erwarten sind
#   100 = nur ueberspringen, wenn die Ausgabe tatsaechlich groesser wuerde
# Kurze Slices ueberschaetzen die neue Bitrate leicht, weil der erste
# Keyframe anteilig stark ins Gewicht faellt. Bei Grenzfaellen hilft ein
# laengerer Slice mehr als eine hoehere Schwelle.
PROBE_MARGIN_PCT=90
PROBE_DURATION=10
FASTSTART=true

# Im In-Place-Modus heisst die Ausgabe "name_h265.mp4". Mit true wird der
# Suffix nach dem Loeschen des Originals entfernt, die Datei heisst also
# wieder "name.mp4". Greift nur, wenn das Original wirklich weg ist, also
# nur mit DELETE_ORIGINAL=true und erfolgreichem Papierkorb.
# Nachteil: man sieht danach nicht mehr, welche Dateien konvertiert wurden.
# RENAME_INPLACE=false

# Liegt .defekte_videos.txt im Zielverzeichnis, ohne Nachfrage nur diese
# Dateien verarbeiten. Default false, weil eine veraltete Liste den restlichen
# Bestand stillschweigend ausblenden wuerde. Bei false wird nur darauf
# hingewiesen; --from-list auto nutzt sie dann fuer einen einzelnen Lauf.
AUTO_FIX_LIST=false
MIN_SIZE_MB=5

# ------------------------------------------------------------------------------
# GIF-Zielformat
# ------------------------------------------------------------------------------
# webp = verlustfrei, bit-exakt, sehr gute Unterstuetzung (Default)
# avif = rund halb so gross, aber verlustbehaftet und schwaecher unterstuetzt
GIF_TARGET="webp"
GIF_AVIF_CRF=20

# ------------------------------------------------------------------------------
# Kurze, tonlose Videos -> animiertes AVIF (scripts/video-to-avif.sh)
# Optional, nicht Teil des normalen Durchlaufs.
# ------------------------------------------------------------------------------
AVIF_MAX_SECONDS=10
AVIF_CRF=32          # kleiner = besser, aber schnell groesser als das Original
AVIF_CRF_RETRY=6     # Aufschlag beim zweiten Versuch, wenn zu gross
AVIF_PRESET=6        # SVT-AV1: 0 langsam/klein ... 13 schnell/gross
AVIF_PIX_FMT="yuv420p"
AVIF_REQUIRE_SILENT=true

# Zusatzstufe im Durchlauf von media-optimizer.sh: kurze, tonlose Videos nach
# AVIF wandeln. Laeuft VOR dem HEVC-Encoding; die HEVC-Stufe ueberspringt
# danach jede Quelle, fuer die bereits eine AVIF-Ausgabe existiert.
ENABLE_AVIF_STAGE=false

# ------------------------------------------------------------------------------
# Protokoll
# ------------------------------------------------------------------------------
# Fortlaufende Datei neben media-optimizer.sh. Bei Ueberschreitung von
# MO_LOG_MAX_KB wird einmalig nach media-optimizer.log.1 rotiert.
MO_LOG=true
# MO_LOG_FILE="/pfad/zur/datei.log"
MO_LOG_MAX_KB=5120

# ------------------------------------------------------------------------------
# Bild-Zielformat
# ------------------------------------------------------------------------------
# jxl  = JPEG bit-exakt verlustfrei, PNG je nach PNG_MODE (Default)
# webp = alles nach WebP. JPEG wird dabei zwangslaeufig verlustbehaftet neu
#        kodiert, weil verlustfreies WebP aus einem JPEG groesser waere.
#        Messwerte bei -q 85: 42-55 % der Quellgroesse, 41-45 dB.
IMG_TARGET="jxl"
IMG_WEBP_QUALITY=85
IMG_DISCARD_IF_LARGER=false
