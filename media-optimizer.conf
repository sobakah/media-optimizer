# ==============================================================================
# media-optimizer.conf
#
# Loaded automatically when this file sits next to media-optimizer.sh, or from
# $XDG_CONFIG_HOME/media-optimizer.conf, or from a path in MO_CONFIG.
#
# Precedence:  CLI flag > interactive input > environment > this file > default
#
# The shipped values target a Ryzen 7 9700X (8C/16T, Zen 5) with an
# RX 9070 XT (RDNA 4, VCN 5). Delete the file to fall back to the built-in
# defaults. MO_CONFIG_VARS in scripts/lib/common.sh lists every supported name.
# ==============================================================================

# ------------------------------------------------------------------------------
# CPU encoding (libx265)
# ------------------------------------------------------------------------------
# pools and frame-threads are left unset on purpose: on 16 threads x265 picks
# one pool over all threads and 4 frame threads by itself.
#
# asm=avx512 is off by default in x265 because it slows down CPUs with a
# halved AVX-512 datapath. Zen 5 has a full one, so it can help here. Measure
# both before committing to it:
#
#   time ffmpeg -i probe.mp4 -c:v libx265 -crf 22 -preset medium \
#        -x265-params asm=avx512:aq-mode=3:no-sao=1 -an -f null -
#   time ffmpeg -i probe.mp4 -c:v libx265 -crf 22 -preset medium \
#        -x265-params aq-mode=3:no-sao=1 -an -f null -
CPU_X265_PARAMS="asm=avx512:aq-mode=3:no-sao=1"
CPU_CRF=22
CPU_PRESET="medium"

# ------------------------------------------------------------------------------
# GPU encoding
# ------------------------------------------------------------------------------
# Container tag for HEVC in MP4. Empty = ffmpeg default (hev1).
#
# "hvc1" improves playback in Apple players but requires VPS/SPS/PPS to live
# only in the hvcC box. If the hardware encoder emits them in-band, the muxer
# builds an incomplete hvcC: correctly encoded, no longer correctly decodable.
# Check with --gpu-selftest before setting it.
HEVC_TAG=""

# GPU encoder. hevc_vaapi is the classic path. Alternatives when a driver
# misbehaves:
#   av1_vaapi    separate, newer code path, saves additional space
#   hevc_vulkan  bypasses VA-API entirely via RADV (ffmpeg 7.1+)
# Find out what works on your hardware:
#   ./scripts/h264-to-h265.sh --gpu-selftest /path/to/video.mp4
GPU_CODEC="hevc_vaapi"

# Rate control. CQP is the classic path; on some VCN generations it is
# unreliable in Mesa and VBR with a target quality works better.
GPU_RC_MODE="CQP"

# B-frames on the GPU. Empty = ffmpeg decides. Some VAAPI drivers produce
# broken pictures with a forced value; --gpu-selftest will show it.
GPU_BF=""

# VAAPI low-power encoder. More stable on some generations, but can limit
# features.
GPU_LOW_POWER=false

# 10-bit sources on the GPU: only valid together with p010 AND
# -profile:v main10. Without both the picture turns green. Default false, so
# 10-bit sources are reduced to 8 bit.
GPU_ALLOW_10BIT=false

VAAPI_DEVICE="auto"   # or fixed, e.g. /dev/dri/renderD129 for the dGPU
GPU_QP=26

# In auto mode, always use the GPU from this frame size upwards, regardless
# of bitrate. A sparsely encoded 4K file has a low bitrate but would still
# stall the batch on libx265. 0 disables the rule.
GPU_MIN_PIXELS=2073600

# auto picks by source bitrate: below the threshold CPU (better density),
# above it GPU (throughput).
ENCODER_MODE="auto"
BITRATE_THRESHOLD_KBPS=3500

# ------------------------------------------------------------------------------
# Video formats
# ------------------------------------------------------------------------------
VIDEO_EXTENSIONS="mp4 m4v mov mkv webm avi ts m2ts wmv flv"

# Target container: auto = mp4 for mp4/m4v/mov, mkv otherwise. MP4 accepts
# neither Opus nor SRT, both common in MKV and WebM; MKV accepts almost
# anything.
VIDEO_CONTAINER="auto"

# Source codecs that get re-encoded. VP9, AV1 and HEVC are already efficient.
SOURCE_CODECS="h264 mpeg4 msmpeg4v3 wmv3 vc1 mpeg2video"

MIN_SIZE_MB=5
FASTSTART=true

# In place the output is named "name_h265.<ext>". With true the suffix is
# removed after the original was deleted, so the file is called "name.<ext>"
# again. Only applies when the original is really gone and the target
# container has the same extension.
# Downside: you can no longer tell from the name which files were converted.
# RENAME_INPLACE=false

# ------------------------------------------------------------------------------
# Probe and verification
# ------------------------------------------------------------------------------
# Before encoding, a test slice from the middle of the file is encoded and
# compared against the same slice of the original (both video only, same
# length, measured by file size).
#   90  = skip as soon as less than 10 % savings are expected
#   100 = skip only when the output would actually grow
#
# PROBE_DURATION is the total test material, split into PROBE_SLICES pieces
# spread over the runtime. A single slice can land on a title card or an
# action peak: measured on a clip with a quiet middle section, one slice
# predicted "74 % larger" and skipped a file that actually shrank by 53 %.
ENABLE_PROBE=true
PROBE_MARGIN_PCT=90
PROBE_DURATION=6
PROBE_SLICES=3

# Sampled picture comparison after encoding (PSNR at several positions).
# Catches broken colour formats that pass the runtime check. Costs about 1 s
# per file.
#
# The BEST sample decides. Measured with the in-memory comparison: sound
# re-encodes land at 31-38 dB, even CRF 51 still reaches 24 dB, while broken
# colour formats sit at 9-12 dB. The threshold of 18 sits between the two
# with room on either side.
#
# VISUAL_STRICT=false means: only warn and keep the file. The measurement can
# be wrong, so you decide, not the script.
VERIFY_VISUAL=true
VISUAL_PSNR_MIN=18
VISUAL_SAMPLES=3
VISUAL_STRICT=false
DISCARD_IF_LARGER=true
KEEP_SALVAGED_CORRUPT=true

# ------------------------------------------------------------------------------
# Parallelism
# ------------------------------------------------------------------------------
# 16 worker processes. Each cjxl process gets one thread, otherwise 16
# processes would each start 16 threads.
MAX_WORKERS=16
CJXL_THREADS=1

# ------------------------------------------------------------------------------
# Images
# ------------------------------------------------------------------------------
# jxl  = JPEG bit-exactly lossless, PNG according to PNG_MODE (default)
# webp = everything to WebP. JPEG is necessarily re-encoded lossily, because
#        lossless WebP from a JPEG would be larger. At -q 85 that is 42-55 %
#        of the source size at 41-45 dB.
IMG_TARGET="jxl"
IMG_WEBP_QUALITY=85
IMG_DISCARD_IF_LARGER=false

# PNG_MODE only affects PNG. JPEG is always transcoded losslessly to JXL.
#
# -q maps to a Butteraugli distance:
#     -q 75 -> d2.35   (visible on text and edges)
#     -q 90 -> d1.00   visually lossless, libjxl's target
#     -q 93 -> d0.73   headroom for screenshots and line art
PNG_MODE="lossy"
PNG_QUALITY=90
JXL_EFFORT=7

# ------------------------------------------------------------------------------
# GIF target format
# ------------------------------------------------------------------------------
# webp = lossless, bit-exact, very good support (default)
# avif = roughly half the size, but lossy
GIF_TARGET="webp"
GIF_AVIF_CRF=20

# ------------------------------------------------------------------------------
# Short silent videos to AVIF (scripts/video-to-avif.sh)
# Optional, not part of the normal run unless ENABLE_AVIF_STAGE=true.
# ------------------------------------------------------------------------------
ENABLE_AVIF_STAGE=false
AVIF_MAX_SECONDS=10
AVIF_CRF=32          # lower is better, but grows past the original fast
AVIF_CRF_RETRY=6     # penalty for the second attempt when too large
AVIF_PRESET=6        # SVT-AV1: 0 langsam/klein ... 13 schnell/gross        # SVT-AV1: 0 slow/small ... 13 fast/large
AVIF_PIX_FMT="yuv420p"
AVIF_REQUIRE_SILENT=true

# ------------------------------------------------------------------------------
# Deletion behaviour
# ------------------------------------------------------------------------------
# DELETE_ORIGINAL and RENAME_INPLACE stay commented out on purpose: without a
# value the preset follows the mode (in place true, with a target directory
# false). Setting a value here fixes it for both modes and suppresses the
# prompt.
# DELETE_ORIGINAL=false

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
# Continuous file next to media-optimizer.sh. Rotated once to
# media-optimizer.log.1 when it exceeds MO_LOG_MAX_KB.
MO_LOG=true
# MO_LOG_FILE="/path/to/file.log"
MO_LOG_MAX_KB=5120

# ------------------------------------------------------------------------------
# Video verification
# ------------------------------------------------------------------------------
# During conversion: compare every encoded video against its source (PSNR
# samples). Catches encoder faults the runtime check cannot see.
# VISUAL_STRICT=true discards a suspicious output instead of only warning.
VERIFY_VISUAL=true
VISUAL_STRICT=false

# After the run: walk the finished target directory once more with
# scripts/verify-output.sh. Needs a target directory, since it compares
# against the untouched originals. Read-only, it never deletes.
ENABLE_VERIFY_OUTPUT=false
CHECK_VISUAL=true

# Use the cache of finished videos. Ignoring it costs one ffprobe per file but
# never changes the result; useful after moving a folder, since the cache
# stores absolute paths.
USE_CACHE=true
